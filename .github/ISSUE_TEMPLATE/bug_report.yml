name: Bug report
description: Report a reproducible RouteTok problem without sensitive data
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, prompts, model responses, or unredacted telemetry."
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
